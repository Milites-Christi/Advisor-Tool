[project]
name = "advisor-tool"
version = "0.1.0"
description = "Starter project for pairing an executor model with a higher-intelligence advisor model via the Anthropic advisor tool (beta)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.44.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["advisor_tool*"]
